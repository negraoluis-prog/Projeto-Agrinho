    <style>
        /* --- PALETA DE CORES E VARIÁVEIS --- */
        :root {
            --verde-escuro: #2C4A3E;
            --verde-folha: #4A7055;
            --verde-claro: #8EA885;
            --marrom-terra: #5C4033;
            --marrom-claro: #A08068;
            --bege-fundo: #F9F6F0;
            --branco-puro: #FFFFFF;
            --texto-escuro: #2B2625;
        }

        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bege-fundo);
            color: var(--texto-escuro);
            line-height: 1.8;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            color: var(--verde-escuro);
            font-weight: 700;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- CABEÇALHO --- */
        header {
            background-color: var(--branco-puro);
            border-bottom: 1px solid rgba(74, 112, 85, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 90px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--verde-escuro);
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--marrom-claro);
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: var(--verde-folha);
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--marrom-terra);
        }

        /* --- HERO SECTION (BANNER) --- */
        .hero {
            background: linear-gradient(rgba(44, 74, 62, 0.7), rgba(92, 64, 51, 0.6)), url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            color: var(--branco-puro);
            padding: 140px 0;
            text-align: center;
        }

        .hero h1 {
            color: var(--branco-puro);
            font-size: 3.5rem;
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            background-color: var(--marrom-terra);
            color: var(--branco-puro);
            padding: 12px 30px;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: var(--verde-folha);
        }

        .main-content {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
